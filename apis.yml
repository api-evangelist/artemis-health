name: Artemis Health
description: 'Artemis Health (now Artemis by Nomi Health) is a healthcare data analytics
  platform that helps employers, benefits advisors, and health plans see every healthcare
  dollar clearly, cut waste, and improve care for their members. The platform unifies
  medical, pharmacy, and other benefits data to deliver cost analysis, program evaluation,
  automated reporting, custom analytics, and social-determinants-of-health insights
  for self-insured organizations. Artemis was acquired by Nomi Health in 2022. The
  product is a login-gated B2B SaaS application; no public developer API, SDKs, or
  documentation surface is published. This profile was surfaced as a portfolio company
  of bessemer-venture-partners and enriched with the verifiable public identity, link,
  and domain-security signals available.'
